<style>
/* ============ RANGLAR VA O'LCHAMLAR (neo-brutalizm) ============ */
:root {
  --paper: #ffffff;
  --mist: #f1f2f7;
  --line: #000000;
  --edge: #000000;
  --ink: #000000;
  --ink-2: #3b3d4a;
  --ink-3: #6b6e7d;
  --sea: #2747e8;
  --sea-ink: #ffffff;
  --sun: #ffc93c;
  --heart: #e5484d;
  --tile: #ffffff;
  --bw: 2px;
  --sh: 4px 4px 0 var(--edge);
  --sh-sm: 2px 2px 0 var(--edge);
  --shadow: var(--sh);
  --font: "Geologica", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Unbounded", "Geologica", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  --paper: #181920;
  --mist: #2a2c38;
  --line: #d8d9e2;
  --edge: #d8d9e2;
  --ink: #f5f5f7;
  --ink-2: #c6c8d4;
  --ink-3: #9295a6;
  --sea: #7b8fff;
  --sea-ink: #000000;
  --tile: #2a2c38;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 88px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1260px; margin: 0 auto; padding: 0 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Bosiladigan elementlar: bosganda soyasiga "cho'kadi" */
.press { transition: transform .12s ease, box-shadow .12s ease, background-color .2s, color .2s; }
.press:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }

/* ============ HEADER ============ */
.top { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: var(--bw) solid var(--edge); }
.top .wrap { height: 68px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; flex: none; }
.brand .mark { width: 38px; height: 38px; color: var(--ink); filter: drop-shadow(3px 3px 0 var(--edge)); }
.brand .mark .spark { transform-origin: 31px 9px; transform-box: view-box; }
.brand:hover .mark .spark { animation: twinkle .9s ease; }
@keyframes twinkle { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.35) rotate(45deg); } 100% { transform: scale(1) rotate(90deg); } }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; line-height: 1; }
.top-search { flex: 1; max-width: 460px; margin-left: 10px; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s; }
.top.show-search .top-search { opacity: 1; transform: none; pointer-events: auto; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.langs { display: flex; border: var(--bw) solid var(--edge); border-radius: 12px; overflow: hidden; background: var(--paper); box-shadow: var(--sh-sm); }
.langs button { font-size: 13px; font-weight: 700; padding: 7px 11px; color: var(--ink-2); transition: background .2s, color .2s; }
.langs button + button { border-left: var(--bw) solid var(--edge); }
.langs button:hover { background: var(--mist); color: var(--ink); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: var(--paper); border: var(--bw) solid var(--edge); box-shadow: var(--sh-sm); transition: transform .12s, box-shadow .12s, background .2s; }
.icon-btn:hover { background: var(--sun); color: #000; }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.only-mobile { display: none; }

/* ============ QIDIRUV ============ */
.search { position: relative; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px 0 18px; border: var(--bw) solid var(--edge); border-radius: 16px; background: var(--paper); box-shadow: 5px 5px 0 var(--edge); transition: box-shadow .18s; }
.search:focus-within { box-shadow: 5px 5px 0 var(--sea); }
.search .ico { color: var(--ink); width: 20px; height: 20px; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 17px; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.search input::placeholder { color: var(--ink-3); }
.search .clear { width: 36px; height: 36px; border-radius: 10px; display: none; place-items: center; color: var(--ink); }
.search .clear:hover { background: var(--mist); }
.search.has-text .clear { display: grid; }
.search kbd { font: 700 12px var(--font); color: var(--ink); border: 1.5px solid var(--edge); border-radius: 7px; padding: 2px 8px; margin-right: 8px; box-shadow: 2px 2px 0 var(--edge); }
.search.has-text kbd { display: none; }
.search.small { height: 44px; border-radius: 12px; box-shadow: 3px 3px 0 var(--edge); padding-left: 14px; }
.search.small:focus-within { box-shadow: 3px 3px 0 var(--sea); }
.search.small input { font-size: 15px; }

/* ============ HERO ============ */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center; padding-top: 58px; padding-bottom: 46px; }
.hero-copy { container-type: inline-size; }
.hero h1 { margin: 0; font-family: var(--display); font-size: clamp(2.1rem, 10cqi, 3.9rem); line-height: 1.04; letter-spacing: -.035em; font-weight: 800; text-wrap: balance; }
.hero .lead { margin: 20px 0 30px; font-size: 18px; line-height: 1.55; color: var(--ink-2); max-width: 30em; text-wrap: pretty; }
.quick { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; padding: 0 4px 4px 0; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; white-space: nowrap; font-size: 14px; font-weight: 600; padding: 6px 13px; border-radius: 999px; border: var(--bw) solid var(--edge); color: var(--ink); background: var(--paper); box-shadow: var(--sh-sm); transition: transform .12s, box-shadow .12s, background .2s; }
.quick button:hover { background: var(--sun); color: #000; }
.quick button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }

/* ============ AI LOGOTIPLARI DEVORI ============ */
.wall-wrap { position: relative; min-width: 0; padding: 22px 0 16px; border: var(--bw) solid var(--edge); border-radius: 24px; background: #2747e8; background-image: radial-gradient(rgba(255, 255, 255, .16) 1.2px, transparent 1.6px); background-size: 20px 20px; box-shadow: 8px 8px 0 var(--edge); overflow: hidden; }
.wall { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; padding: 4px 0 8px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
.wall-row { display: flex; width: max-content; animation: rowIn .9s cubic-bezier(.2, .8, .2, 1) both, slide var(--dur, 80s) linear infinite; animation-delay: var(--in, 0s), 0s; }
.wall-row.rev { animation-direction: normal, reverse; }
.wall:hover .wall-row { animation-play-state: running, paused; }
@keyframes slide { to { transform: translateX(-50%); } }
@keyframes rowIn { from { opacity: 0; translate: 0 18px; } }
.wl { flex: none; width: 104px; margin-right: 8px; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 10px 6px 8px; border-radius: 16px; }
.wl .logo { width: 64px; height: 64px; border-radius: 17px; box-shadow: 4px 4px 0 var(--edge); transition: transform .15s, box-shadow .15s; }
.wl .logo svg { width: 33px; height: 33px; }
.wl:hover .logo, .wl:focus-visible .logo { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--edge); }
.wl:active .logo { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.wl:focus-visible { outline-color: #fff; }
.wl-n { max-width: 100%; font-size: 13px; font-weight: 600; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ============ KATALOG ============ */
.catalog { display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 44px; padding-top: 34px; padding-bottom: 80px; border-top: var(--bw) solid var(--edge); }
.rail { position: sticky; top: 90px; align-self: start; max-height: calc(100vh - 104px); overflow: auto; scrollbar-width: thin; padding: 0 6px 6px 0; }
.side { padding: 10px; border: var(--bw) solid var(--edge); border-radius: 18px; background: var(--paper); box-shadow: var(--sh); }
.side h3 { margin: 6px 10px 8px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.side .sep { border: 0; border-top: var(--bw) solid var(--edge); margin: 8px 4px; }
.regions { display: flex; flex-direction: column; gap: 3px; }
.region { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px 5px 6px; border-radius: 11px; font-size: 14.5px; color: var(--ink-2); text-align: left; transition: background .15s, color .15s; }
.region:hover { background: var(--mist); color: var(--ink); }
.region .ri { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #000; border: 1.5px solid var(--edge); background: color-mix(in srgb, var(--c) 30%, #fff); transition: background .2s, color .2s; }
.region .ri .ico { width: 16px; height: 16px; }
.region .rn { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.region .n { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.region[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }
.region[aria-pressed="true"] .ri { background: var(--c); color: #fff; }
.region[aria-pressed="true"] .n { color: color-mix(in srgb, var(--paper) 70%, transparent); }

/* Narx va tartib — kartalar ustidagi bitta qator */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
.toolbar .lbl { font-size: 14px; font-weight: 600; color: var(--ink-3); margin-right: 12px; }
.toolbar .left { display: flex; align-items: center; min-width: 0; }
.seg { display: inline-flex; border: var(--bw) solid var(--edge); border-radius: 12px; background: var(--paper); box-shadow: 3px 3px 0 var(--edge); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; padding: 8px 15px; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s; }
.seg button + button { border-left: var(--bw) solid var(--edge); }
.seg button:hover { background: var(--mist); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sortbox { position: relative; flex: none; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border: var(--bw) solid var(--edge); border-radius: 12px; background: var(--paper); box-shadow: 3px 3px 0 var(--edge); color: var(--ink); transition: background .2s; }
.sortbox:hover { background: var(--mist); }
.sortbox .ico { width: 16px; height: 16px; }
.sortbox select { border: 0; background: transparent; font-size: 14px; font-weight: 600; color: var(--ink); outline: none; cursor: pointer; }
.sortbox select option { background: var(--paper); color: var(--ink); }

.res-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.res-head h2 { margin: 0; display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: 28px; line-height: 1.15; letter-spacing: -.025em; font-weight: 800; }
.res-head h2 .sw { width: 18px; height: 18px; border-radius: 5px; border: var(--bw) solid var(--edge); background: var(--c); flex: none; }
.res-head p { margin: 8px 0 0; color: var(--ink-2); max-width: 46em; }
.res-head .count { color: var(--ink-3); font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.chip-reset { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sea); font-weight: 700; white-space: nowrap; }
.chip-reset:hover { text-decoration: underline; text-underline-offset: 3px; }

.group { margin-bottom: 50px; }
.group-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 12px; margin-bottom: 20px; border-bottom: var(--bw) solid var(--edge); }
.group-head h3 { margin: 0; display: flex; align-items: center; gap: 11px; font-family: var(--display); font-size: 19px; line-height: 1.2; letter-spacing: -.015em; font-weight: 700; }
.group-head h3 .sw { width: 15px; height: 15px; border-radius: 4px; border: var(--bw) solid var(--edge); background: var(--c); flex: none; }
.group-head p { margin: 5px 0 0; font-size: 14.5px; color: var(--ink-3); }
.see-all { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--ink); padding: 7px 12px; border-radius: 11px; border: var(--bw) solid var(--edge); background: var(--paper); box-shadow: var(--sh-sm); transition: transform .12s, box-shadow .12s, background .2s, color .2s; }
.see-all:hover { background: var(--c); color: #fff; }
.see-all:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.see-all .n { color: var(--ink-3); font-weight: 600; }
.see-all:hover .n { color: rgba(255, 255, 255, .85); }

/* ============ AI KARTASI ============ */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px; border: var(--bw) solid var(--edge); border-radius: 16px; background: var(--tile); box-shadow: var(--sh); transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--edge); }
.tile:has(.tile-open:active) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
.tile.new { animation: tileIn .45s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0s); }
@keyframes tileIn { from { opacity: 0; translate: 0 10px; } }
.tile-top { display: flex; align-items: center; gap: 12px; padding-right: 36px; min-width: 0; }
.tile-name { display: block; font-weight: 700; font-size: 16.5px; line-height: 1.25; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-dom { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-desc { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3em; }
.tile-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1.5px dashed color-mix(in srgb, var(--edge) 35%, transparent); font-size: 12.5px; min-width: 0; }
:root[data-theme="dark"] .tile-foot { border-top-color: rgba(255, 255, 255, .14); }
.tag { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-weight: 500; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid var(--edge); background: var(--c); flex: none; }
.price { margin-left: auto; flex: none; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1.5px solid var(--edge); color: #000; }
.p-F { background: #a8efc7; }
.p-M { background: #ffe27a; }
.p-P { background: #d9cbff; }
.star { color: #f2a900; font-size: 13px; margin-left: 4px; }
.tile-open { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.tile-open:focus-visible { outline-offset: 3px; border-radius: 16px; }
.fav { position: absolute; top: 12px; right: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); border: var(--bw) solid transparent; transition: background .2s, color .2s, border-color .2s; }
.fav:hover { background: var(--mist); color: var(--heart); border-color: var(--edge); }
.fav.on { color: var(--heart); }
.fav.on svg { fill: currentColor; animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

/* Logotip qutisi (doim oq, logotiplar yaxshi ko'rinishi uchun) */
.logo { position: relative; flex: none; width: 46px; height: 46px; border-radius: 13px; background: #fff; border: var(--bw) solid #000; display: grid; place-items: center; overflow: hidden; }
.logo svg { width: 25px; height: 25px; }
.logo img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; }
.logo .mono { display: none; position: absolute; inset: 0; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: -.03em; color: color-mix(in srgb, var(--c) 75%, #000); background: color-mix(in srgb, var(--c) 18%, #fff); }
.logo.failed .mono { display: grid; }
.logo.failed img { display: none; }

/* ============ BO'SH HOLAT, TUGMALAR ============ */
.empty { text-align: center; padding: 70px 20px; color: var(--ink-2); }
.empty svg { margin: 0 auto 16px; width: 120px; height: 80px; }
.empty p { max-width: 28em; margin: 0 auto 18px; font-size: 16.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15px; border: var(--bw) solid var(--edge); background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--edge); transition: transform .12s, box-shadow .12s, background .2s; text-decoration: none; }
.btn:hover { background: var(--mist); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--edge); }
.btn.primary { background: var(--sea); color: var(--sea-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--sea) 88%, #000); }
.more { display: flex; justify-content: center; margin-top: 34px; }
.to-top { position: fixed; right: 18px; bottom: 18px; z-index: 20; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--sun); color: #000; border: var(--bw) solid var(--edge); box-shadow: 3px 3px 0 var(--edge); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .25s, transform .25s, box-shadow .12s; }
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.to-top.show:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--edge); }

/* ============ AI HAQIDA OYNA ============ */
dialog.sheet { padding: 0; border: 0; border-left: 3px solid var(--edge); margin: 0 0 0 auto; width: min(470px, 100vw); max-width: none; height: 100dvh; max-height: none; background: var(--paper); color: var(--ink); transform: translateX(104%); transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
dialog.sheet.open { transform: none; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0); transition: background .3s; }
dialog.sheet.open::backdrop { background: rgba(0, 0, 0, .45); }
.sheet-in { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 22px 26px 30px; display: flex; flex-direction: column; }
.sheet-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.sheet-bar .crumbs { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); font-weight: 600; }
.sheet-bar .crumbs .sw { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--edge); background: var(--c); }
.sheet-hero { display: flex; align-items: center; gap: 18px; }
.sheet-hero .logo { width: 76px; height: 76px; border-radius: 20px; box-shadow: 4px 4px 0 var(--edge); }
.sheet-hero .logo svg { width: 40px; height: 40px; }
.sheet-hero .logo img { width: 44px; height: 44px; border-radius: 10px; }
.sheet-hero .logo .mono { font-size: 26px; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 25px; line-height: 1.15; letter-spacing: -.025em; font-weight: 800; overflow-wrap: anywhere; }
.sheet .dom { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 14.5px; color: var(--ink-3); text-decoration: none; }
.sheet .dom:hover { color: var(--sea); text-decoration: underline; text-underline-offset: 3px; }
.sheet .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 18px; }
.fact { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--paper); color: var(--ink); }
.facts .price { margin: 0; padding: 5px 11px; font-size: 13.5px; }
.fact .sw { width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid var(--edge); background: var(--c); }
.sheet .about { margin: 0 0 20px; font-size: 17px; line-height: 1.6; text-wrap: pretty; }
.purpose { padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, var(--paper)); border: var(--bw) solid var(--edge); box-shadow: 3px 3px 0 var(--edge); margin-bottom: 24px; }
.purpose b { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
.purpose span { font-size: 14.5px; color: var(--ink-2); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions .primary { grid-column: 1 / -1; height: 54px; font-size: 16px; border-radius: 14px; }
.actions .btn.on { color: var(--heart); }
.actions .btn.on svg { fill: currentColor; }
.similar { margin-top: 32px; }
.similar h3 { margin: 0 0 10px; font-family: var(--display); font-size: 15px; font-weight: 700; }
.sim { display: flex; align-items: center; gap: 12px; padding: 8px 10px; margin: 0 -10px; width: calc(100% + 20px); border-radius: 12px; text-align: left; transition: background .15s; }
.sim:hover { background: var(--mist); }
.sim .logo { width: 40px; height: 40px; border-radius: 11px; }
.sim .logo svg { width: 21px; height: 21px; }
.sim .logo img { width: 24px; height: 24px; }
.sim .t { min-width: 0; flex: 1; }
.sim .t b { display: block; font-weight: 700; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sim .t span { display: block; font-size: 13px; color: var(--ink-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sheet-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 28px; }
.sheet-nav .btn { flex: 1; }
.sheet-nav .btn[disabled] { opacity: .4; pointer-events: none; }

/* ============ FOOTER ============ */
.foot { border-top: var(--bw) solid var(--edge); padding: 28px 0 40px; color: var(--ink-3); font-size: 13.5px; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; }
.foot .brand .mark { width: 30px; height: 30px; filter: drop-shadow(2px 2px 0 var(--edge)); }
.foot .brand .wordmark { font-size: 17px; color: var(--ink); }
.foot p { margin: 0; max-width: 54em; }


/* ============ SAYT HAQIDA HAVOLASI ============ */
.nav-link { font-size: 14.5px; font-weight: 700; padding: 8px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; transition: background .2s; }
.nav-link:hover { background: var(--mist); }
.foot-link { margin-right: auto; font-weight: 700; color: var(--ink); text-underline-offset: 3px; }

/* ============ QANDAY FOYDALANILADI ============ */
.how { padding-bottom: 54px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: var(--bw) solid var(--edge); border-radius: 18px; background: var(--paper); box-shadow: var(--sh); overflow: hidden; }
.steps li { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; min-width: 0; }
.steps li + li { border-left: var(--bw) solid var(--edge); }
.steps .num { flex: none; width: 34px; height: 34px; border-radius: 10px; border: var(--bw) solid var(--edge); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; background: var(--sun); color: #000; }
.steps b { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; margin: 5px 0 4px; }
.steps .t { display: block; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.how-more { display: inline-flex; align-items: center; gap: 4px; margin-top: 16px; font-size: 14.5px; font-weight: 700; color: var(--sea); text-decoration: none; }
.how-more:hover { text-decoration: underline; text-underline-offset: 3px; }
.how-more .ico { width: 16px; height: 16px; }

/* ============ YO'NALISHLAR TO'RI (telefonda bosh ko'rinish) ============ */
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat-card { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 11px 10px; border: var(--bw) solid var(--edge); border-radius: 14px; background: var(--tile); box-shadow: 3px 3px 0 var(--edge); text-align: left; transition: transform .12s, box-shadow .12s; }
.cat-card:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--edge); }
.cat-card .ri { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #000; border: 1.5px solid var(--edge); background: color-mix(in srgb, var(--c) 30%, #fff); }
.cat-card .ri .ico { width: 18px; height: 18px; }
.cat-card .cx { min-width: 0; }
.cat-card .cn { display: block; font-size: 14px; font-weight: 700; line-height: 1.2; }
.cat-card .cc { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }
.back { display: none; }

/* ============ MOSLASHUVCHAN (MOBIL) ============ */
@media (max-width: 1180px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 980px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 30px; padding-top: 30px; padding-bottom: 44px; }
  html { scroll-padding-top: 68px; }
  .catalog { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-top: 0; border-top: 0; }
  .home-view .catalog { border-top: var(--bw) solid var(--edge); }
  .rail { position: sticky; top: 68px; z-index: 10; max-height: none; overflow: visible; margin: 0 -24px; padding: 10px 0 6px; background: var(--paper); border-bottom: var(--bw) solid var(--edge); }
  .side { padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
  .side h3, .side .sep { display: none; }
  .regions { flex-direction: row; overflow-x: auto; gap: 8px; padding: 0 24px 5px; scrollbar-width: none; }
  .regions::-webkit-scrollbar { display: none; }
  .region { width: auto; flex: none; padding: 3px 12px 3px 3px; border: var(--bw) solid var(--edge); border-radius: 999px; font-size: 14px; background: var(--paper); box-shadow: var(--sh-sm); }
  .region .ri { width: 26px; height: 26px; border-radius: 999px; }
  .region .ri .ico { width: 14px; height: 14px; }
  .region .rn { overflow: visible; }
  .toolbar { margin-bottom: 20px; }
  .toolbar .lbl { display: none; }
  .toolbar .left { flex: 1; }
  .seg { flex: 1; }
  .seg button { flex: 1; padding: 8px 8px; font-size: 13.5px; }
  .sortbox { width: 42px; padding: 0; justify-content: center; }
  .sortbox select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .top-search { display: none; }
  .only-mobile { display: grid; }
  .res-head h2 { font-size: 23px; }
}
@media (max-width: 640px) {
  .wrap { padding-left: 16px; padding-right: 16px; }
  .rail { margin: 0 -16px; top: 64px; }
  .regions { padding: 0 16px 5px; }
  .top .wrap { height: 64px; gap: 10px; }
  .top-tools { gap: 8px; }
  .wordmark { font-size: 18px; }
  .brand { gap: 9px; }
  .brand .mark { width: 34px; height: 34px; }
  .langs button { padding: 6px 8px; font-size: 12.5px; }
  .icon-btn { width: 38px; height: 38px; }
  .hero .lead { font-size: 16.5px; margin: 14px 0 22px; }
  .search { height: 56px; box-shadow: 4px 4px 0 var(--edge); }
  .search:focus-within { box-shadow: 4px 4px 0 var(--sea); }
  .search kbd { display: none; }
  .quick { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 16px -16px 0; padding: 0 16px 6px; }
  .wall-wrap { margin-right: 6px; border-radius: 20px; box-shadow: 6px 6px 0 var(--edge); padding: 16px 0 10px; }
  .wl { width: 86px; margin-right: 4px; padding: 10px 4px 8px; }
  .wl .logo { width: 54px; height: 54px; border-radius: 15px; box-shadow: 3px 3px 0 var(--edge); }
  .wl .logo svg { width: 28px; height: 28px; }
  .wl-n { font-size: 12px; }
  .wall-row:nth-child(4) { display: none; }
  .grid { grid-template-columns: 1fr; }
  .group .grid { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 84%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 4px 16px 12px; scrollbar-width: none; }
  .group .grid::-webkit-scrollbar { display: none; }
  .group .tile { scroll-snap-align: start; }
  .group-head { flex-wrap: wrap; }
  .group-head p { display: none; }
  .res-head { flex-direction: column; align-items: flex-start; }

  /* Telefon: ortiqcha narsalarsiz, ixcham ko'rinish */
  .nav-link { display: none; }
  .hero { padding-bottom: 30px; gap: 24px; }
  .wall-wrap { padding: 12px 0 6px; border-radius: 18px; box-shadow: 5px 5px 0 var(--edge); }
  .wl { width: 78px; margin-right: 2px; padding: 8px 4px 6px; gap: 7px; }
  .wl .logo { width: 48px; height: 48px; border-radius: 14px; box-shadow: 3px 3px 0 var(--edge); }
  .wl .logo svg { width: 25px; height: 25px; }
  .wl .logo img { width: 26px; height: 26px; }
  .wl-n { font-size: 11.5px; }
  .wall-row:nth-child(n+3) { display: none; }
  .how { padding-bottom: 34px; }
  .steps { grid-template-columns: minmax(0, 1fr); border-radius: 16px; }
  .steps li { padding: 13px 14px; gap: 12px; }
  .steps li + li { border-left: 0; border-top: var(--bw) solid var(--edge); }
  .steps .num { width: 30px; height: 30px; font-size: 13.5px; }
  .steps b { font-size: 15px; margin: 3px 0 2px; }
  .steps .t { font-size: 13.5px; }
  html { scroll-padding-top: 64px; }
  .home-view .rail, .home-view .toolbar { display: none; }
  .res-head .chip-reset { display: none; }
  .home-view .catalog { padding-top: 28px; }
  .back { display: inline-flex; align-items: center; gap: 4px; margin: 2px 0 14px; padding: 6px 13px 6px 8px; font-size: 14px; font-weight: 700; border: var(--bw) solid var(--edge); border-radius: 999px; background: var(--paper); box-shadow: var(--sh-sm); }
  .back .ico { width: 16px; height: 16px; }
  .back:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
  .res-head { margin-bottom: 18px; }
  .res-head h2 { font-size: 21px; }
  .grid { gap: 14px; }
  .tile { padding: 13px 14px; gap: 9px; border-radius: 14px; }
  .tile-top { gap: 11px; padding-right: 34px; }
  .tile .logo { width: 42px; height: 42px; border-radius: 12px; }
  .tile .logo svg { width: 22px; height: 22px; }
  .tile .logo img { width: 25px; height: 25px; }
  .tile-name { font-size: 15.5px; }
  .tile-desc { font-size: 13.5px; min-height: 0; }
  .tile-foot { padding-top: 0; border-top: 0; }
  .fav { top: 9px; right: 9px; }
  .foot .wrap { gap: 12px 20px; }
  dialog.sheet { margin: auto 0 0 0; width: 100vw; height: auto; max-height: 92dvh; border-left: 0; border-top: 3px solid var(--edge); border-radius: 22px 22px 0 0; transform: translateY(104%); }
  .sheet-in { max-height: 92dvh; padding: 18px 20px 26px; }
  .sheet h2 { font-size: 22px; }
  .to-top { right: 14px; bottom: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .pulse { display: none; }
}
</style>

    var done = function () {
      var s = $('span', btn), old = s.textContent;
      s.textContent = tr('copied'); $('use', btn).setAttribute('href', '#i-check');
      setTimeout(function () { s.textContent = tr('copy'); $('use', btn).setAttribute('href', '#i-link'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
    }
  }

  // ================= ELEMENTLAR VA HODISALAR =================
  var rail = $('#rail'), toolbar = $('#toolbar'), results = $('#results'), wall = $('#wall'), sheet = $('#sheet'), sheetIn = $('#sheetIn');
  var catalog = $('#catalog'), qMain = $('#q'), qTop = $('#qTop'), topBar = $('#top'), toTop = $('#toTop');
  var MOBILE = window.matchMedia('(max-width: 640px)');
  var onMobileChange = function () { update(); };
  if (MOBILE.addEventListener) MOBILE.addEventListener('change', onMobileChange); else if (MOBILE.addListener) MOBILE.addListener(onMobileChange);

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-open],[data-fav],[data-region],[data-price],[data-quick],[data-lang],[data-act]');
    if (!el) return;
    if (el.hasAttribute('data-open')) { openTool(el.getAttribute('data-open'), el); return; }
    if (el.hasAttribute('data-fav')) { toggleFav(el.getAttribute('data-fav')); return; }
    if (el.hasAttribute('data-region')) {
      var r = el.getAttribute('data-region');
      state.region = (state.region === r && r !== 'all' && !el.hasAttribute('data-scroll')) ? 'all' : r;
      state.limit = PAGE;
      update({ animate: true, scroll: el.hasAttribute('data-scroll') });
      return;
    }
    if (el.hasAttribute('data-price')) { state.price = el.getAttribute('data-price'); state.limit = PAGE; update({ animate: true }); return; }
    if (el.hasAttribute('data-quick')) { setQuery(el.getAttribute('data-quick')); catalog.scrollIntoView({ behavior: 'smooth' }); return; }
    if (el.hasAttribute('data-lang')) { setLang(el.getAttribute('data-lang')); return; }
    var a = el.getAttribute('data-act');
    if (a === 'home') { e.preventDefault(); closeSheet(); state.region = 'all'; state.price = 'all'; state.sort = 'popular'; setQuery(''); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'clear') { e.preventDefault(); setQuery(''); el.parentNode.querySelector('input').focus(); }
    else if (a === 'reset') { state.region = 'all'; state.price = 'all'; state.sort = 'popular'; setQuery(''); }
    else if (a === 'back') { state.region = 'all'; state.price = 'all'; state.sort = 'popular'; setQuery(''); catalog.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (a === 'more') appendMore();
    else if (a === 'theme') setTheme(document.documentElement.dataset.theme !== 'dark');
    else if (a === 'top') window.scrollTo({ top: 0, behavior: 'smooth' });
    else if (a === 'close') closeSheet();
    else if (a === 'prev') step(-1);
    else if (a === 'next') step(1);
    else if (a === 'copy') copyLink(el.getAttribute('data-id'), el);
    else if (a === 'focus-search') { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(function () { qMain.focus(); }, 350); }
  });

  // Qidiruv maydonlari
  var qTimer;
  [qMain, qTop].forEach(function (inp) {
    inp.addEventListener('input', function () {
      var v = inp.value; inp.parentNode.classList.toggle('has-text', !!v);
      clearTimeout(qTimer); qTimer = setTimeout(function () { setQuery(v, inp); }, 140);
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { clearTimeout(qTimer); setQuery(inp.value, inp); catalog.scrollIntoView({ behavior: 'smooth' }); inp.blur(); }
      if (e.key === 'Escape') { setQuery(''); inp.blur(); }
    });
  });

  // Klaviatura: "/" qidiruv, ← → oynada almashtirish
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (sheet.open) {
      if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
      return;
    }
    if (e.key === '/' && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(tag) < 0) {
      e.preventDefault();
      (topBar.classList.contains('show-search') && window.innerWidth > 980 ? qTop : qMain).focus();
    }
  });
  sheet.addEventListener('cancel', function (e) { e.preventDefault(); closeSheet(); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });

  // Sahifa aylantirilganda
  function onScroll() {
    var y = window.scrollY;
    topBar.classList.toggle('scrolled', y > 8);
    toTop.classList.toggle('show', y > 900);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { topBar.classList.toggle('show-search', !en[0].isIntersecting); }, { rootMargin: '-70px 0px 0px 0px' }).observe($('#heroSearch'));
    new IntersectionObserver(function (en) {
      if (en[0].isIntersecting && $('#moreBtn')) appendMore();
    }, { rootMargin: '500px 0px' }).observe($('.foot'));
  }
  window.addEventListener('hashchange', openFromHash);
  function openFromHash() {
    var m = location.hash.match(/^#ai\/([a-z0-9-]+)$/);
    if (m && BY_ID[m[1]]) openTool(m[1]);
  }

  // ================= ISHGA TUSHIRISH =================
  document.documentElement.lang = state.lang;
  $('#themeIco use').setAttribute('href', document.documentElement.dataset.theme === 'dark' ? '#i-sun' : '#i-moon');
  applyStatic();
  buildWall();
  update();
  onScroll();
  openFromHash();

  // Tekshiruv uchun (konsolda): window.AILand
  window.AILand = { state: state, tools: TOOLS, filtered: filtered, openTool: openTool, setQuery: setQuery, setLang: setLang };
})();
</script>
</body>
</html>
